server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  include /etc/nginx/security-headers.conf;

  location = /healthz { access_log off; include /etc/nginx/security-headers.conf; add_header Content-Type text/plain; return 200 "ok\n"; }
  location /assets/ { include /etc/nginx/security-headers.conf; expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  # /oauth/mercadolivre (retorno do login do Mercado Livre) e qualquer rota do painel caem no index.html
  location / { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-store"; try_files $uri /index.html; }
}

# Painel admin atrás do Nginx Proxy Manager (rede externa "proxy").
# Uso:  cp deploy/admin.env.example deploy/admin.env  (preencha)  &&  docker compose -f deploy/docker-compose.admin.yml --env-file deploy/admin.env up -d --build
services:
  promo-admin:
    build:
      context: ../admin
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?defina VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?defina VITE_SUPABASE_ANON_KEY}
    container_name: promo-admin
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    networks: [proxy]
    # Sem "ports": o acesso é só pelo proxy reverso (HTTPS) apontando para promo-admin:80.
networks:
  proxy:
    external: true

# Postgres local só para TESTAR as migrações (não é o seu Supabase).
# Uso: npm run db:up  →  npm run db:test
services:
  db:
    image: postgres:16
    container_name: promo-local-db
    environment:
      POSTGRES_PASSWORD: local-only
    ports: ["127.0.0.1:54329:5432"]
    volumes:
      - ../db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
